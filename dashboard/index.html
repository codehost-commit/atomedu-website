<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | Atom Edu</title>
    <meta name="description" content="Atom Edu dashboard." />
    <link rel="icon" href="/public/favicon.png" />
    <style>
      :root { --ink:#14231e; --paper:#f7faf8; --line:#d7e0dc; --muted:#65716a; --blue:#2258ef; }
      * { box-sizing:border-box; } body { margin:0; font-family:"DM Sans",Arial,sans-serif; background:var(--paper); color:var(--ink); display:grid; min-height:100vh; place-items:center; padding:24px; }
      .panel { width:min(680px,100%); background:#fff; border:1px solid var(--line); padding:32px 28px; }
      h1 { margin:0 0 10px; font-size:42px; line-height:1; } p { margin:0 0 16px; color:var(--muted); line-height:1.6; } a { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 16px; border:1px solid var(--blue); background:var(--blue); color:#fff; text-decoration:none; font-size:13px; font-weight:700; }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Dashboard needs the live backend.</h1>
      <p>GitHub Pages can host the public marketing site, but a real teacher dashboard needs authentication, storage, and server-side routes.</p>
      <a href="/login/">Open sign-in page</a>
    </section>
  </body>
</html>
